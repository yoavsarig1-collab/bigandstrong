<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@300;400;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
    a { color: #3f6b4a; } a:hover { color: #2c4d35; }
    @keyframes sway-1 { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes sway-2 { 0%,100% { transform: rotate(2.5deg); } 50% { transform: rotate(-2.5deg); } }
    @keyframes float-b { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; background:
     radial-gradient(130% 100% at 12% 8%, #dfe9d4 0%, #cfe0c2 30%, #bcd4ac 55%, #a9c898 78%, #9cbe8b 100%);">

  <!-- gradient-mesh depth -->
  <div style="position: absolute; right: -180px; top: -160px; width: 720px; height: 720px;
       background: radial-gradient(circle, rgba(120,168,110,0.55) 0%, rgba(120,168,110,0) 65%); animation: float-b 13s ease-in-out infinite;"></div>
  <div style="position: absolute; left: -200px; bottom: -180px; width: 760px; height: 760px;
       background: radial-gradient(circle, rgba(214,228,196,0.7) 0%, rgba(214,228,196,0) 62%);"></div>

  <!-- botanical sprig, top-right, swaying -->
  <svg width="360" height="440" viewBox="0 0 360 440" style="position: absolute; right: 40px; top: 30px; transform-origin: 300px 40px; animation: sway-1 9s ease-in-out infinite;">
    <g fill="none" stroke="#5e8a56" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
      <path d="M300 20 C 250 120, 200 220, 150 400"/>
    </g>
    <g fill="#6f9a63" fill-opacity="0.42">
      <path d="M276 78 C 250 62, 226 66, 214 84 C 240 100, 266 96, 276 78Z"/>
      <path d="M256 132 C 232 118, 208 124, 198 142 C 224 156, 248 150, 256 132Z"/>
      <path d="M238 188 C 214 176, 190 182, 182 200 C 208 212, 230 206, 238 188Z"/>
      <path d="M262 108 C 286 96, 310 102, 320 122 C 294 134, 270 128, 262 108Z"/>
      <path d="M242 164 C 266 152, 290 158, 300 178 C 274 190, 250 184, 242 164Z"/>
      <path d="M220 226 C 244 214, 268 220, 278 240 C 252 252, 228 246, 220 226Z"/>
    </g>
  </svg>

  <!-- second, smaller sprig bottom-left -->
  <svg width="240" height="300" viewBox="0 0 240 300" style="position: absolute; left: 34px; bottom: 150px; transform-origin: 40px 280px; animation: sway-2 11s ease-in-out infinite;">
    <g fill="none" stroke="#5e8a56" stroke-width="2.2" stroke-linecap="round" opacity="0.4">
      <path d="M50 290 C 90 210, 120 140, 170 20"/>
    </g>
    <g fill="#6f9a63" fill-opacity="0.34">
      <path d="M92 196 C 116 184, 140 190, 150 210 C 124 222, 100 216, 92 196Z"/>
      <path d="M110 138 C 134 126, 158 132, 168 152 C 142 164, 118 158, 110 138Z"/>
      <path d="M76 232 C 52 220, 34 226, 26 244 C 50 256, 70 250, 76 232Z"/>
    </g>
  </svg>

  <!-- content -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 108px 100px 96px;">

    <div style="display: flex; gap: 16px; align-items: center;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #3f6b4a;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #3f6b4a; opacity: .55;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #3f6b4a; opacity: .3;"></span>
    </div>

    <div style="font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.4em;
         text-transform: uppercase; color: #4a7351; margin-top: 42px;">on&nbsp;&nbsp;attention</div>

    <!-- staggered, stepped headline (each line offset — not straight) -->
    <div style="margin-top: 40px; font-family: 'Marcellus', Palatino, serif; color: #263c2b; line-height: 1.06;">
      <div style="font-size: 118px; transform: translateX(0);">What you</div>
      <div style="font-size: 118px; transform: translateX(96px); margin-top: 6px; color: #3f6b4a; font-style: italic;">water,</div>
      <div style="font-size: 118px; transform: translateX(34px); margin-top: 6px;">grows.</div>
    </div>

    <p style="margin: 0; margin-top: 54px; max-width: 720px; font-family: 'Work Sans', sans-serif; font-weight: 300;
         font-size: 44px; line-height: 1.9; letter-spacing: 0.012em; color: #33472f;">
      <b>Y</b>our <b>at</b>tention <b>i</b>s <b>n</b>ot <b>fr</b>ee. <b>I</b>t <b>i</b>s <b>t</b>he <b>o</b>nly <b>s</b>oil <b>y</b>ou <b>o</b>wn. <b>Pl</b>ant <b>i</b>t <b>ca</b>refully&nbsp;&mdash; <b>a</b>nd <b>o</b>nly <b>wh</b>ere <b>y</b>ou <b>wa</b>nt <b>a</b> <b>fo</b>rest.
    </p>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; gap: 20px;">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="#3f6b4a" stroke-width="2" stroke-linecap="round">
        <path d="M26 46 C 26 30, 26 22, 26 10"/>
        <path d="M26 24 C 14 22, 8 15, 8 6 C 18 7, 25 13, 26 24Z" fill="#3f6b4a" fill-opacity="0.16"/>
        <path d="M26 30 C 38 28, 44 21, 44 12 C 34 13, 27 19, 26 30Z" fill="#3f6b4a" fill-opacity="0.12"/>
      </svg>
      <span style="font-family: 'Caveat', cursive; font-size: 68px; color: #3f6b4a; line-height: 1;">yoav</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
