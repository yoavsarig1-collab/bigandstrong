<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@300;400;600&family=Heebo:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Frank Ruhl Libre', Georgia, serif; }
    a { color: #e7c48a; } a:hover { color: #f2d6a4; }
    @keyframes tide-1 { 0% { transform: translateX(0); } 100% { transform: translateX(-160px); } }
    @keyframes tide-2 { 0% { transform: translateX(0); } 100% { transform: translateX(140px); } }
    @keyframes glow-c { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; direction: rtl; background:
     linear-gradient(178deg, #16232e 0%, #1b2c37 30%, #223642 55%, #2c4149 78%, #37505199 100%),
     radial-gradient(90% 60% at 50% 105%, #6a5a74 0%, #2c4149 55%, #16232e 100%);">

  <div style="position: absolute; left: 50%; bottom: -220px; width: 1000px; height: 700px; transform: translateX(-50%);
       background: radial-gradient(circle, rgba(211,153,120,0.5) 0%, rgba(150,120,140,0.25) 40%, rgba(150,120,140,0) 70%);
       animation: glow-c 12s ease-in-out infinite;"></div>

  <svg viewBox="0 0 1400 400" width="1400" height="400" preserveAspectRatio="none" style="position: absolute; left: -160px; bottom: 60px; opacity: 0.5; animation: tide-1 24s linear infinite;">
    <g fill="none" stroke="#7fa6ad" stroke-width="2">
      <path d="M0 200 C 175 120, 350 280, 525 200 S 875 120, 1050 200 S 1400 280, 1400 200"/>
      <path d="M0 260 C 175 180, 350 340, 525 260 S 875 180, 1050 260 S 1400 340, 1400 260" opacity="0.6"/>
    </g>
  </svg>
  <svg viewBox="0 0 1400 400" width="1400" height="400" preserveAspectRatio="none" style="position: absolute; left: -140px; bottom: 10px; opacity: 0.35; animation: tide-2 30s linear infinite;">
    <g fill="none" stroke="#9db8bd" stroke-width="1.6">
      <path d="M0 220 C 200 150, 400 300, 600 220 S 1000 150, 1200 220 S 1400 300, 1400 220"/>
    </g>
  </svg>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 108px 100px 96px; direction: rtl;">

    <div style="display: flex; gap: 16px; align-items: center;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #e7c48a;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #e7c48a; opacity: .55;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #e7c48a; opacity: .3;"></span>
    </div>

    <div style="font-family: 'Heebo', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 0.34em;
         color: #cbb98f; margin-top: 42px;">על הפחד</div>

    <!-- headline along a wave (RTL) -->
    <svg viewBox="0 0 960 340" width="912" style="margin-top: 34px; overflow: visible;">
      <path id="waveC" d="M 10 186 C 190 110, 350 250, 500 182 S 790 108, 950 176" fill="none"/>
      <text text-anchor="middle" direction="rtl" style="font-family: 'Suez One', Georgia, serif; font-weight: 400; font-size: 80px; fill: #f2ead9;">
        <textPath href="#waveC" startOffset="50%">הגאות תמיד חוזרת.</textPath>
      </text>
    </svg>

    <p style="margin: 0; margin-top: 30px; max-width: 780px; font-family: 'Frank Ruhl Libre', Georgia, serif; font-weight: 300;
         font-size: 47px; line-height: 1.92; letter-spacing: 0.008em; color: #d6dfe0;">
      <b>ש</b>ום <b>ד</b>בר <b>שא</b>תה <b>או</b>הב <b>ל</b>א <b>עו</b>זב <b>בא</b>מת. <b>ה</b>וא <b>יו</b>צא, <b>כ</b>די <b>שי</b>וכל <b>לח</b>זור <b>ול</b>מצוא <b>או</b>תך <b>עד</b>יין <b>עו</b>מד <b>ע</b>ל <b>הח</b>וף.
    </p>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="26" height="34" viewBox="0 0 26 34" fill="none" stroke="#e7c48a" stroke-width="1.6" stroke-linecap="round">
        <path d="M13 32 C 13 20, 13 14, 13 5"/>
        <path d="M13 15 C 6 14, 2 9, 2 3 C 9 4, 13 8, 13 15Z" fill="#e7c48a" fill-opacity="0.2"/>
        <path d="M13 20 C 20 19, 24 14, 24 8 C 17 9, 13 13, 13 20Z" fill="#e7c48a" fill-opacity="0.14"/>
      </svg>
      <span style="font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 46px; letter-spacing: 0.04em; color: #e7c48a;">יואב</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
