<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Frank Ruhl Libre', Georgia, serif; }
    a { color: #a8632f; } a:hover { color: #814824; }
    @keyframes drift-a { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(0,-14px,0) scale(1.015); } }
    @keyframes breathe-a { 0%,100% { opacity: .5; } 50% { opacity: .85; } }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; overflow: hidden; direction: rtl; background:
     radial-gradient(120% 90% at 50% 118%, #e8b785 0%, #eccfa6 22%, #f0e2cb 46%, #f4ecdc 68%, #f6f1e6 100%);">

  <div style="position: absolute; left: 50%; bottom: -260px; width: 900px; height: 900px; transform: translateX(-50%);
       background: radial-gradient(circle, rgba(233,170,109,0.55) 0%, rgba(233,170,109,0.18) 42%, rgba(233,170,109,0) 68%);
       animation: breathe-a 11s ease-in-out infinite;"></div>

  <svg viewBox="0 0 1080 1350" width="1080" height="1350" style="position: absolute; inset: 0; animation: drift-a 16s ease-in-out infinite;">
    <g fill="none" stroke="#c07b45" stroke-width="1.4" opacity="0.32">
      <ellipse cx="540" cy="1120" rx="250" ry="120"/>
      <ellipse cx="540" cy="1120" rx="360" ry="176"/>
      <ellipse cx="540" cy="1120" rx="474" ry="236"/>
      <ellipse cx="540" cy="1120" rx="592" ry="300"/>
      <ellipse cx="540" cy="1120" rx="712" ry="368"/>
      <ellipse cx="540" cy="1120" rx="836" ry="440"/>
    </g>
  </svg>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 104px 108px 96px; direction: rtl;">

    <!-- pause cue -->
    <div style="display: flex; gap: 16px; align-items: center;">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b06a34;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b06a34; opacity: .55;"></span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #b06a34; opacity: .3;"></span>
    </div>

    <div style="font-family: 'Heebo', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 0.34em;
         color: #9a5a2c; margin-top: 40px;">על הזמן</div>

    <!-- curved headline on an arc (RTL) -->
    <svg viewBox="0 0 900 300" width="864" style="margin-top: 30px; overflow: visible;">
      <path id="arcA" d="M 40 232 Q 450 96 860 232" fill="none"/>
      <text text-anchor="middle" direction="rtl" style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-weight: 500; font-size: 118px; fill: #33241a;">
        <textPath href="#arcA" startOffset="50%">לא איחרנו.</textPath>
      </text>
    </svg>

    <!-- body with key-letter emphasis (leading letters bolded) -->
    <p style="margin: 0; margin-top: 14px; max-width: 780px; font-weight: 400; font-size: 47px; line-height: 1.95; letter-spacing: 0.008em; color: #4a3a2c;">
      <b>אנ</b>חנו <b>חו</b>שבים <b>שא</b>נחנו <b>רו</b>דפים <b>אח</b>רי <b>ה</b>יום. <b>א</b>בל <b>ה</b>יום <b>ה</b>וא <b>נ</b>הר&nbsp;&mdash; <b>וא</b>נחנו <b>א</b>לה <b>שע</b>ומדים <b>ע</b>ל <b>הג</b>דה, <b>יב</b>שים, <b>מפ</b>חדים <b>לה</b>יכנס.
    </p>

    <div style="flex-grow: 1;"></div>

    <!-- refined signature -->
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="26" height="34" viewBox="0 0 26 34" fill="none" stroke="#b06a34" stroke-width="1.6" stroke-linecap="round">
        <path d="M13 32 C 13 20, 13 14, 13 5"/>
        <path d="M13 15 C 6 14, 2 9, 2 3 C 9 4, 13 8, 13 15Z" fill="#b06a34" fill-opacity="0.16"/>
        <path d="M13 20 C 20 19, 24 14, 24 8 C 17 9, 13 13, 13 20Z" fill="#b06a34" fill-opacity="0.12"/>
      </svg>
      <span style="font-family: 'Frank Ruhl Libre', serif; font-weight: 500; font-size: 46px; letter-spacing: 0.04em; color: #8f5227;">יואב</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
